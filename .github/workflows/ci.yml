name: CI

# lib-net's own tests, then every program that uses it, built and tested against this commit
# (Droidtop/tracker#867 D2: "each repo's CI builds and tests every app that uses it"). Each program says
# how it builds in its own library-check.yml; this only names the submodule and the commit. Work lands on
# main from ci/* branches once this is green.
#
# droidtop and Enginehost still take this library as vendor/droidtop-shared, the repository it moved from,
# so the commit is fetched from this repository into that submodule. When a program moves its submodule
# to vendor/lib-net, its job here changes with it.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test every module, and check its public API against its dump
        run: ./gradlew test apiCheck --stacktrace

  # The public API stays compatible within a version (Droidtop/tracker#867, owner 2026-11-04: "I should be able to
  # bump the version number and immediately get the benefit"): an API line removed since the last release fails
  # unless lib.version is a breaking version and the CHANGELOG says what broke.
  api-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-api-compat.sh

  # The Rust crates (Cargo.toml; Droidtop/tracker#573's share client, net-remote): format, lints and tests, then a
  # build for both Android ABIs the programs ship. net-remote's WebDAV backend is tested against a real WebDAV
  # server (wsgidav) started here; crates/remote/tests/webdav_live.rs. The user and password are this test server's
  # own, made up here.
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: One version for the Gradle modules and the Rust crates
        run: |
          set -eu
          gradle="$(sed -n 's/^lib\.version=//p' gradle.properties)"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "lib.version $gradle, Cargo.toml $cargo"
          [ -n "$gradle" ] && [ "$gradle" = "$cargo" ]
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      - name: Start a WebDAV server for net-remote's tests
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/dav-venv"
          "$RUNNER_TEMP/dav-venv/bin/pip" install -q wsgidav==4.3.3 cheroot==10.0.1
          mkdir -p "$RUNNER_TEMP/dav-root"
          cat > "$RUNNER_TEMP/dav.yaml" <<EOF
          host: 127.0.0.1
          port: 8089
          provider_mapping:
            "/dav": "$RUNNER_TEMP/dav-root"
          http_authenticator:
            accept_basic: true
            accept_digest: false
            default_to_digest: false
          simple_dc:
            user_mapping:
              "*":
                "tester":
                  password: "test-only-password"
          verbose: 1
          EOF
          "$RUNNER_TEMP/dav-venv/bin/wsgidav" --config "$RUNNER_TEMP/dav.yaml" > "$RUNNER_TEMP/dav.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null -u tester:test-only-password http://127.0.0.1:8089/dav/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null -u tester:test-only-password http://127.0.0.1:8089/dav/
          {
            echo "NET_REMOTE_WEBDAV_URL=http://127.0.0.1:8089/dav/"
            echo "NET_REMOTE_WEBDAV_USER=tester"
            echo "NET_REMOTE_WEBDAV_PASSWORD=test-only-password"
            echo "NET_REMOTE_WEBDAV_REQUIRED=1"
          } >> "$GITHUB_ENV"
      # net-remote's SFTP backend against a real OpenSSH server on 127.0.0.1:2222, with an ed25519 host key made
      # here and a user whose password is made up here; crates/remote/tests/sftp_live.rs.
      - name: Start an SFTP server for net-remote's tests
        run: |
          set -eu
          command -v /usr/sbin/sshd >/dev/null || { sudo apt-get update -q; sudo apt-get install -y -q openssh-server; }
          sudo useradd -m sftptest
          echo 'sftptest:test-only-password' | sudo chpasswd
          sudo -u sftptest mkdir -p /home/sftptest/share
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/hostkey"
          sudo install -m 600 -o root -g root "$RUNNER_TEMP/hostkey" /etc/ssh/net_remote_hostkey
          cat > "$RUNNER_TEMP/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/net_remote_hostkey
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          UsePAM yes
          PermitRootLogin no
          AllowUsers sftptest
          Subsystem sftp internal-sftp
          PidFile $RUNNER_TEMP/sshd.pid
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f "$RUNNER_TEMP/sshd_config"
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config" -E "$RUNNER_TEMP/sshd.log"
          for _ in $(seq 1 30); do
            if ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ssh-keyscan -p 2222 127.0.0.1 >/dev/null
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/hostkey.pub" -E sha256 | awk '{print $2}')"
          echo "host key: $fingerprint"
          {
            echo "NET_REMOTE_SFTP_HOST=127.0.0.1"
            echo "NET_REMOTE_SFTP_PORT=2222"
            echo "NET_REMOTE_SFTP_USER=sftptest"
            echo "NET_REMOTE_SFTP_PASSWORD=test-only-password"
            echo "NET_REMOTE_SFTP_HOST_KEY=$fingerprint"
            echo "NET_REMOTE_SFTP_FOLDER=share"
            echo "NET_REMOTE_SFTP_REQUIRED=1"
          } >> "$GITHUB_ENV"
      # net-remote's S3 backend against a real S3-compatible server that checks signatures: versitygw (Apache-2.0)
      # v1.10.0's release build, checked against the release's own checksums, with root keys made up here;
      # crates/remote/tests/s3_live.rs.
      - name: Start an S3 server for net-remote's tests
        env:
          VGW: "1.10.0"
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          base="https://github.com/versity/versitygw/releases/download/v$VGW"
          tarball="versitygw_v${VGW}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/checksums.txt" | grep " $tarball\$" | sha256sum -c -
          mkdir -p vgw s3root
          tar -xzf "$tarball" -C vgw
          # The binary's folder inside the tarball differs between releases.
          vgw_bin="$(find vgw -type f -name versitygw | head -n 1)"
          [ -n "$vgw_bin" ] || { echo "no versitygw in $tarball:"; find vgw; exit 1; }
          chmod +x "$vgw_bin"
          ROOT_ACCESS_KEY=test-access ROOT_SECRET_KEY=test-only-secret "$vgw_bin" --port 127.0.0.1:7070 posix "$RUNNER_TEMP/s3root" > vgw.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:7070/; then break; fi
            sleep 1
          done
          curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" --user test-access:test-only-secret -X PUT http://127.0.0.1:7070/droidtop-test
          {
            echo "NET_REMOTE_S3_ENDPOINT=http://127.0.0.1:7070"
            echo "NET_REMOTE_S3_BUCKET=droidtop-test"
            echo "NET_REMOTE_S3_ACCESS_KEY=test-access"
            echo "NET_REMOTE_S3_SECRET_KEY=test-only-secret"
            echo "NET_REMOTE_S3_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - name: Test
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast
      - name: The S3 server's log, when a test failed
        if: failure()
        run: cat "$RUNNER_TEMP/vgw.log" || true
      - name: The SFTP server's log, when a test failed
        if: failure()
        run: sudo cat "$RUNNER_TEMP/sshd.log" || true
      - name: The WebDAV server's log, when a test failed
        if: failure()
        run: cat "$RUNNER_TEMP/dav.log" || true
      - name: Build for arm64-v8a and x86_64 (Android)
        shell: bash
        run: |
          set -eu
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo build --release --workspace --target "$target"
          done

  # The Rust crates' public interface stays compatible within a version, as the Kotlin modules' does (api-compat).
  # cargo-semver-checks compares each crate with the last release; a crate that release did not have yet has
  # nothing to compare with and is skipped.
  rust-semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@0e09747a63ae497bf945b3dcaf38fef0050d0109 # v2.62.0
        with:
          tool: cargo-semver-checks@0.51.0
      - name: No breaking change without a version that says so
        run: |
          set -eu
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$last" ]; then echo "nothing released yet; nothing to compare"; exit 0; fi
          checked=0
          for manifest in crates/*/Cargo.toml; do
            name="$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -1)"
            if ! git cat-file -e "$last:$manifest" 2>/dev/null; then
              echo "$name is new since $last; nothing to compare"
              continue
            fi
            echo "comparing $name with $last"
            cargo semver-checks check-release -p "$name" --baseline-rev "$last"
            checked=$((checked + 1))
          done
          echo "$checked crates compared"

  droidtop:
    uses: Droidtop/droidtop/.github/workflows/library-check.yml@main
    with:
      submodule: vendor/droidtop-shared
      repository: Droidtop/lib-net
      ref: ${{ github.sha }}

  enginehost:
    uses: Droidtop/enginehost/.github/workflows/library-check.yml@main
    with:
      submodule: vendor/droidtop-shared
      repository: Droidtop/lib-net
      ref: ${{ github.sha }}

  # A green main whose version has no tag yet is released: CI tags v<version> on this commit, and that tag is
  # what the programs pin (#867 D2). To release, raise lib.version in gradle.properties (and the CHANGELOG) in
  # the change that needs it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, api-compat, rust, rust-semver, droidtop, enginehost]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(sed -n 's/^lib\.version=//p' gradle.properties)"
          [ -n "$version" ] || { echo "no lib.version in gradle.properties" >&2; exit 1; }
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "released $tag at $GITHUB_SHA"
          fi
