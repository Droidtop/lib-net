[package]
name = "net-remote"
description = "One client for the person's own shares and cloud storage: a folder on this computer, WebDAV, and more backends to come"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# SFTP (src/sftp.rs), on by default. A program whose dependency graph can't take russh 0.65's ed25519-dalek 3 yet
# turns default features off and keeps WebDAV and S3 (droidtop, while droidtop-agent's windowcast pins sspi 0.21,
# which needs ed25519-dalek =3.0.0-rc.1).
default = ["sftp"]
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio"]

[dependencies]
thiserror.workspace = true
rand_core.workspace = true
ureq.workspace = true
roxmltree.workspace = true
percent-encoding.workspace = true
httpdate.workspace = true
base64.workspace = true
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rusty-s3.workspace = true
url.workspace = true
